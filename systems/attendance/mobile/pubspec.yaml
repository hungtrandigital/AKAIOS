name: ak_attendance_mobile
description: "AKAIUNSAN Attendance mobile app — employee check-in/out via GPS + photo."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0

  # Storage (secure for JWT)
  flutter_secure_storage: ^9.2.2

  # Location + Camera
  geolocator: ^13.0.1
  # Newer endorsed Android implementations require Flutter/compile SDK levels
  # beyond the validated Flutter 3.24 toolchain.
  geolocator_android: 4.6.1
  flutter_plugin_android_lifecycle: 2.0.24
  permission_handler: ^11.3.1
  image_picker: ^1.1.2

  # i18n
  intl: any

  # JSON
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/prismate_logo_black.png
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
