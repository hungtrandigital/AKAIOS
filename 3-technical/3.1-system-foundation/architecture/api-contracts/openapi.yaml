openapi: 3.1.0

info:
  title: AKAIUNSAN Attendance + Payroll API
  version: 1.0.0
  description: |
    REST API for AKAIUNSAN attendance and payroll systems (PRD-EPIC-002, Phase 0).

    **Auth:** Bearer JWT (15-min TTL) + refresh token cookie (30 days).
    **Internal:** `X-Internal-API-Key` header (service-to-service only).
    **Rate limits:** Production API instances enforce a global 100 requests/minute limit; auth endpoints add OTP/challenge abuse controls.
    **Time:** ISO 8601 UTC; VN time (UTC+7) at presentation layer.
    **Money:** VNĐ as string (Decimal); never float.
    **Errors:** `{ error: { code, message, details? } }`

    Full schemas live in this file. Full business rules in
    [Domain Specs](../domain-specs.md). Architecture in
    [System Design](../../design-standards/system-design.md).

    Code conventions in [Coding Standards](../../design-standards/coding-standards.md).

  contact:
    name: AKAIUNSAN Engineering
    email: engineering@ak.local

tags:
  - name: auth
    description: Login, OTP, 2FA, refresh
  - name: identity
    description: Users and employees
  - name: projects
    description: Customer project sites
  - name: shifts
    description: Shift templates and assignments
  - name: attendance
    description: Check-in/out, records, overrides
  - name: reports
    description: Customer report generation (PDF/CSV)
  - name: payroll
    description: Payroll periods, lines, approval
  - name: payroll-rules
    description: Configurable payroll rules
  - name: rbac
    description: Permission catalog and role mappings (system_admin only)
  - name: internal
    description: Service-to-service (X-Internal-API-Key required)

security:
  - bearerAuth: []

paths:

  # ===== AUTH =====
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Employee login (phone + password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeLogin' }
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie:
              schema: { type: string }
              description: refreshToken cookie (httpOnly, Secure, SameSite=Strict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/request-otp:
    post:
      tags: [auth]
      summary: Request OTP via SMS
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, pattern: '^\+84[0-9]{9}$', example: '+84912345678' }
      responses:
        '200': { description: OTP sent (always 200 to prevent enumeration) }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/login-otp:
    post:
      tags: [auth]
      summary: Login with phone + OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone: { type: string, pattern: '^\+84[0-9]{9}$' }
                otp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }

  /v1/auth/admin-login:
    post:
      tags: [auth]
      summary: Admin login (email + password); always starts mandatory TOTP challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLogin' }
      responses:
        '200':
          description: TOTP challenge created in an httpOnly SameSite=Strict cookie
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Opaque totpChallenge cookie; no challenge token is returned in JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorRequired' }

  /v1/auth/verify-2fa:
    post:
      tags: [auth]
      summary: Verify TOTP (admin only)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totpCode]
              properties:
                totpCode: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token (browser cookie or native request body)
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: Native clients only }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, example: 900 }
                  refreshToken: { type: string, description: Present for native/body-token rotation }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout (revoke refresh token)
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: Native clients only }
      responses:
        '204': { description: OK }

  /v1/auth/me:
    get:
      tags: [auth]
      summary: Current user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # ===== EMPLOYEES =====
  /v1/employees:
    get:
      tags: [identity]
      summary: List employees
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/LimitParam' }
        - in: query
          name: status
          schema: { type: string, enum: [active, inactive] }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedEmployees' }
    post:
      tags: [identity]
      summary: Create employee (BO/system admin; permission-gated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreate' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/employees/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [identity]
      summary: Get employee
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [identity]
      summary: Update employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
  # ===== PROJECTS =====
  /v1/projects:
    get:
      tags: [projects]
      summary: List projects
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [active, paused, ended] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
    post:
      tags: [projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }

  /v1/projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [projects]
      summary: Get project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
    patch:
      tags: [projects]
      summary: Update project (BO/system admin; permission-gated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/projects/{id}/supervisors:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [projects]
      summary: List explicit project supervisor memberships (BO/system admin only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectSupervisor' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [projects]
      summary: Grant explicit project supervisor membership (BO/system admin only, audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        '200':
          description: Membership granted or already present
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSupervisor' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{id}/supervisors/{userId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: userId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [projects]
      summary: Revoke project supervisor membership immediately (BO/system admin only, audited)
      responses:
        '204': { description: Membership revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===== SHIFTS =====
  /v1/shifts:
    get:
      tags: [shifts]
      summary: List shift templates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Shift' }
    post:
      tags: [shifts]
      summary: Create shift template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftCreate' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }

  /v1/shifts/assignments:
    get:
      tags: [shifts]
      summary: List shift assignments
      parameters:
        - in: query
          name: employeeId
          schema: { type: string, format: uuid }
        - in: query
          name: projectId
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [scheduled, checked_in, checked_out, completed, missed, cancelled] }
        - in: query
          name: from
          description: Inclusive shift-assignment work date.
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Inclusive shift-assignment work date.
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination, summary]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ShiftAssignmentRoster' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  summary: { $ref: '#/components/schemas/ShiftAssignmentSummary' }
    post:
      tags: [shifts]
      summary: Assign shift to employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftAssignmentCreate' }
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftAssignment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /v1/shifts/assignments/{id}/cancel:
    post:
      tags: [shifts]
      summary: Cancel a scheduled shift assignment
      description: |
        BO/admin may cancel tenant assignments; supervisors are limited to projects where they have active membership.
        Only an assignment still in `scheduled` state and without attendance can be cancelled. The reason and actor are audited.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftAssignmentCancel' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftAssignmentRoster' }
        '400':
          description: Invalid or too-short cancellation reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  # ===== ATTENDANCE =====
  /v1/attendance/my-today:
    get:
      tags: [attendance]
      summary: Current employee's assignment for today
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ShiftAssignmentWithAttendance'
                  - $ref: '#/components/schemas/NoAssignmentToday'

  /v1/attendance/check-in:
    post:
      tags: [attendance]
      summary: Employee check-in (GPS + photo)
      description: |
        Enforces BR-ATT-001 (GPS in geofence), BR-ATT-002 (late), BR-ATT-004 (no double), BR-ATT-005 (photo required).
        JPEG data is fully decoded, limited to 5 MB and 16 MP, and must be at least 320x240.
        The official app offers camera-only capture, but MVP has no device attestation/liveness;
        direct API camera origin and capture time are therefore not cryptographically proven.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckInRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecord' }
        '400':
          description: Invalid request or non-JPEG photo data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /v1/attendance/check-out:
    post:
      tags: [attendance]
      summary: Employee check-out (GPS + photo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckOutRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecord' }
        '400':
          description: Invalid request or non-JPEG photo data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /v1/attendance/assignments/{id}/manual-event:
    post:
      tags: [attendance]
      summary: Record an audited manual check-in/out after capture failure
      description: |
        Requires `attendance.override` and an active supervisor with explicit project membership,
        or a system-admin break-glass account. Employees and BO reviewers cannot call this path.
        A supervisor cannot record their own attendance. The event stores no synthetic GPS/photo;
        it is durably marked through override provenance and an atomic `override_attendance` audit.
        Event time must match the assignment business date (or next date for overnight checkout)
        and its support window from four hours before shift start to twelve hours after shift end.
      parameters:
        - in: path
          name: id
          required: true
          description: Shift-assignment ID.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualAttendanceEvent' }
      responses:
        '200':
          description: Manual event recorded and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }

  /v1/attendance/records:
    get:
      tags: [attendance]
      summary: Query attendance records (admin/supervisor)
      parameters:
        - in: query
          name: employeeId
          schema: { type: string, format: uuid }
        - in: query
          name: projectId
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: status
          schema: { type: string, enum: [present, late, early_leave, half_day, absent, on_leave, holiday] }
        - in: query
          name: limit
          description: Maximum records returned; defaults to 100.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AttendanceRecordWithAssignment' }

  /v1/attendance/records/{id}/override:
    post:
      tags: [attendance]
      summary: Override attendance record (supervisor/admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceOverride' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecord' }

  # ===== CUSTOMER REPORTS =====
  /v1/reports/customer:
    get:
      tags: [reports]
      summary: List customer reports; supervisors see only explicitly assigned projects
      parameters:
        - in: query
          name: projectId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tenant- and membership-scoped report metadata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [reports]
      summary: Generate customer report (PDF or CSV)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerReportRequest' }
      responses:
        '200':
          description: Generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId: { type: string, format: uuid }
                  downloadUrl:
                    type: string
                    description: Presigned URL, 5-min expiry
                  size: { type: integer, minimum: 0 }
                  generatedAt: { type: string, format: date-time }

  # ===== PAYROLL =====
  /v1/payroll/periods:
    get:
      tags: [payroll]
      summary: List payroll periods
      parameters:
        - in: query
          name: year
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string, enum: [open, calculating, calculated, approved, paid, locked] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollPeriod' }
    post:
      tags: [payroll]
      summary: Open new payroll period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month]
              properties:
                year: { type: integer, example: 2026 }
                month: { type: integer, minimum: 1, maximum: 12, example: 7 }
      responses:
        '200':
          description: Opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriod' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/payroll/periods/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [payroll]
      summary: Get period with lines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PayrollPeriod'
                  - type: object
                    properties:
                      lines:
                        type: array
                        items: { $ref: '#/components/schemas/PayrollLine' }

  /v1/payroll/periods/{id}/calculate:
    post:
      tags: [payroll]
      summary: Calculate payroll synchronously in a serialized transaction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Calculated
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  message: { type: string }
                  periodId: { type: string, format: uuid }
                  linesCreated: { type: integer }
        '502': { $ref: '#/components/responses/AttendanceBadGateway' }
        '503': { $ref: '#/components/responses/AttendanceUnavailable' }

  /v1/payroll/periods/{id}/approve:
    post:
      tags: [payroll]
      summary: Approve payroll period (bo_admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriod' }

  /v1/payroll/periods/{id}/lock:
    post:
      tags: [payroll]
      summary: Lock period (system_admin only, irreversible)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Locked }

  /v1/payroll/periods/{id}/mark-paid:
    post:
      tags: [payroll]
      summary: Mark an approved payroll period as paid
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriod' }

  /v1/payroll/periods/{id}/export:
    get:
      tags: [payroll]
      summary: Export period to Excel (XLSX)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: XLSX file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /v1/payroll/lines/{id}/override:
    post:
      tags: [payroll]
      summary: Override or clear allowance, advance, and other deductions on a payroll line
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayrollLineOverride' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollLine' }

  # ===== PAYROLL RULES =====
  /v1/payroll/rules:
    get:
      tags: [payroll-rules]
      summary: List payroll rule versions for the authenticated tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollRule' }
    post:
      tags: [payroll-rules]
      summary: Create new payroll rules version (system_admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayrollRuleCreate' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRule' }

  # ===== RBAC =====
  /v1/rbac/permissions:
    get:
      tags: [rbac]
      summary: List the permission catalog
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }

  /v1/rbac/roles:
    get:
      tags: [rbac]
      summary: List role-permission mappings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RolePermissions' }

  /v1/rbac/roles/{role}:
    put:
      tags: [rbac]
      summary: Replace all permissions assigned to a role
      parameters:
        - in: path
          name: role
          required: true
          schema:
            type: string
            enum: [employee, supervisor, bo_admin, system_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionCodes]
              properties:
                permissionCodes:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                type: object
                required: [role, permissionCodes, count]
                properties:
                  role: { type: string }
                  permissionCodes:
                    type: array
                    items: { type: string }
                  count: { type: integer }

  # ===== INTERNAL (service-to-service) =====
  /internal/attendance:
    get:
      tags: [internal]
      summary: Attendance data for payroll (internal only)
      security:
        - internalApiKey: []
      parameters:
        - in: query
          name: tenantId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: employeeId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          required: true
          description: Inclusive assignment work date; the inclusive range may contain at most 366 calendar days.
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          description: Inclusive assignment work date; must be on or after `from`.
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InternalAttendanceRecord' }
        '400':
          description: Invalid calendar date, reversed range, or range longer than 366 days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (15-min TTL)
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-API-Key
      description: Shared secret, rotated quarterly

  parameters:
    PageParam:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Resource already exists or state violation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BusinessRuleViolation:
      description: Domain rule violated (e.g., GPS outside geofence)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AttendanceBadGateway:
      description: Attendance service returned an invalid or failed response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AttendanceUnavailable:
      description: Attendance service timed out or could not be reached
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ===== Common =====
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: { type: object, additionalProperties: true }

    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    GPSCoordinate:
      type: object
      required: [latitude, longitude, accuracy]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        accuracy: { type: number, format: double, minimum: 0, description: GPS accuracy in meters }

    # ===== Auth =====
    EmployeeLogin:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string, pattern: '^\+84[0-9]{9}$' }
        password: { type: string, minLength: 6 }

    AdminLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        refreshToken: { type: string, description: Native employee sessions; browser admin sessions use the cookie }
        user: { $ref: '#/components/schemas/User' }

    TwoFactorRequired:
      type: object
      required: [message, expiresIn]
      properties:
        message: { type: string, example: '2FA verification required' }
        expiresIn: { type: integer, example: 300 }

    # ===== User / Employee =====
    User:
      type: object
      required: [id, phone, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, 'null'], format: email }
        phone: { type: string }
        role: { type: string, enum: [employee, supervisor, bo_admin, system_admin] }
        status: { type: string, enum: [active, inactive, suspended] }
        employee: { anyOf: [{ $ref: '#/components/schemas/Employee' }, { type: 'null' }] }

    Employee:
      type: object
      required: [id, userId, employeeCode, fullName, hireDate, baseSalary, salaryType, status]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        employeeCode: { type: string, example: NV001 }
        fullName: { type: string, example: 'Nguyễn Văn A' }
        dateOfBirth: { type: [string, 'null'], format: date }
        hireDate: { type: string, format: date }
        baseSalary: { type: string, description: 'VNĐ as string Decimal, e.g. 10000000.00' }
        salaryType: { type: string, enum: [monthly, hourly] }
        hourlyRate: { type: [string, 'null'] }
        bankAccount: { type: [string, 'null'] }
        bankName: { type: [string, 'null'] }
        idNumber: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        user:
          type: object
          required: [id, phone, role, status]
          properties:
            id: { type: string, format: uuid }
            email: { type: [string, 'null'], format: email }
            phone: { type: string }
            role: { type: string, enum: [employee] }
            status: { type: string, enum: [active, inactive, suspended] }
        temporaryPassword: { type: string, description: Present only on employee creation }

    EmployeeSupervisorView:
      type: object
      required: [id, userId, employeeCode, fullName, status, user]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        employeeCode: { type: string }
        fullName: { type: string }
        status: { type: string, enum: [active, inactive] }
        user:
          type: object
          required: [id, phone, role, status]
          properties:
            id: { type: string, format: uuid }
            email: { type: [string, 'null'], format: email }
            phone: { type: string }
            role: { type: string, enum: [employee] }
            status: { type: string, enum: [active, inactive, suspended] }
        temporaryPassword: { type: string, description: Present only on employee creation }

    AttendanceEmployeeView:
      type: object
      required: [id, userId, employeeCode, fullName, status]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        employeeCode: { type: string }
        fullName: { type: string }
        status: { type: string, enum: [active, inactive] }

    EmployeeResponse:
      oneOf:
        - $ref: '#/components/schemas/Employee'
        - $ref: '#/components/schemas/EmployeeSupervisorView'

    EmployeeCreate:
      type: object
      required: [phone, fullName, hireDate, baseSalary, salaryType]
      properties:
        phone: { type: string, pattern: '^\+84[0-9]{9}$' }
        fullName: { type: string }
        employeeCode: { type: string }
        dateOfBirth: { type: string, format: date }
        hireDate: { type: string, format: date, description: Must not be in the future in the Vietnam business calendar. }
        baseSalary: { type: string, pattern: '^\d+(?:\.\d{1,2})?$' }
        salaryType: { type: string, enum: [monthly, hourly] }
        hourlyRate: { type: string, pattern: '^\d+(?:\.\d{1,2})?$' }
        bankAccount: { type: string }
        bankName: { type: string }
        idNumber: { type: string }
        temporaryPassword: { type: string, minLength: 8 }
      allOf:
        - if:
            properties:
              salaryType: { const: hourly }
            required: [salaryType]
          then:
            required: [hourlyRate]
            properties:
              hourlyRate:
                type: string
                pattern: '^(?:[1-9]\d*(?:\.\d{1,2})?|0\.(?:0[1-9]|[1-9]\d?))$'

    EmployeeUpdate:
      type: object
      description: The merged stored employee plus patch must contain a positive hourlyRate whenever the effective salaryType is hourly.
      properties:
        fullName: { type: string }
        baseSalary: { type: string, pattern: '^\d+(?:\.\d{1,2})?$' }
        salaryType: { type: string, enum: [monthly, hourly] }
        hourlyRate: { type: string, pattern: '^\d+(?:\.\d{1,2})?$' }
        bankAccount: { type: string }
        bankName: { type: string }
        status: { type: string, enum: [active, inactive] }

    PaginatedEmployees:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EmployeeResponse' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ===== Project =====
    Project:
      type: object
      required: [id, code, name, clientName, address, latitude, longitude, geofenceRadiusMeters, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: PRJ001 }
        name: { type: string }
        clientName: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        geofenceRadiusMeters: { type: integer, default: 100 }
        contractStartDate: { type: string, format: date }
        contractEndDate: { type: [string, 'null'], format: date }
        status: { type: string, enum: [active, paused, ended] }

    ProjectCreate:
      type: object
      required: [code, name, clientName, address, latitude, longitude, contractStartDate]
      properties:
        code: { type: string }
        name: { type: string }
        clientName: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        geofenceRadiusMeters: { type: integer, default: 100 }
        contractStartDate: { type: string, format: date }
        contractEndDate: { type: string, format: date }

    ProjectUpdate:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        clientName: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        geofenceRadiusMeters: { type: integer, minimum: 1 }
        contractStartDate: { type: string, format: date }
        contractEndDate: { type: string, format: date }
        status: { type: string, enum: [active, paused, ended] }
        reportTemplateConfig: { type: object, additionalProperties: true }

    ProjectSupervisor:
      type: object
      required: [userId, createdAt]
      properties:
        projectId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        assignedById: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        supervisor:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: [string, 'null'], format: email }
            phone: { type: string }
            status: { type: string, enum: [active, inactive, suspended] }

    # ===== Shift =====
    Shift:
      type: object
      required: [id, tenantId, name, startTime, endTime, breakMinutes, lateThresholdMinutes, isOvernight, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string, example: 'Ca sáng' }
        startTime: { type: string, example: '06:00' }
        endTime: { type: string, example: '14:00' }
        breakMinutes: { type: integer, default: 60 }
        lateThresholdMinutes: { type: integer, default: 15 }
        isOvernight: { type: boolean, default: false }
        color: { type: [string, 'null'], example: '#FF5733' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ShiftCreate:
      type: object
      required: [name, startTime, endTime]
      properties:
        name: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        breakMinutes: { type: integer }
        lateThresholdMinutes: { type: integer }
        isOvernight: { type: boolean }
        color: { type: string }

    ShiftAssignment:
      type: object
      required: [id, employeeId, projectId, shiftId, date, status, assignedById, assignedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        shiftId: { type: string, format: uuid }
        date:
          type: string
          format: date-time
          description: Prisma `DATE` serialized as an ISO date-time at UTC midnight.
        status: { type: string, enum: [scheduled, checked_in, checked_out, completed, missed, cancelled] }
        assignedById: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ShiftAssignmentCreate:
      type: object
      required: [employeeId, projectId, shiftId, date]
      properties:
        employeeId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        shiftId: { type: string, format: uuid }
        date: { type: string, format: date }
        notes: { type: string }

    ShiftAssignmentCancel:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500 }

    ShiftAssignmentEmployee:
      type: object
      required: [id, userId, employeeCode, fullName, status]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        employeeCode: { type: string }
        fullName: { type: string }
        status: { type: string, enum: [active, inactive, suspended] }

    ShiftAssignmentRoster:
      allOf:
        - $ref: '#/components/schemas/ShiftAssignment'
        - type: object
          required: [employee, project, shift, attendanceRecord]
          properties:
            employee: { $ref: '#/components/schemas/ShiftAssignmentEmployee' }
            project: { $ref: '#/components/schemas/Project' }
            shift: { $ref: '#/components/schemas/Shift' }
            attendanceRecord: { anyOf: [{ $ref: '#/components/schemas/AttendanceRecord' }, { type: 'null' }] }

    ShiftAssignmentSummary:
      type: object
      required: [scheduled, checked_in, checked_out, completed, missed, cancelled]
      properties:
        scheduled: { type: integer, minimum: 0 }
        checked_in: { type: integer, minimum: 0 }
        checked_out: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        missed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }

    ShiftAssignmentWithAttendance:
      allOf:
        - $ref: '#/components/schemas/ShiftAssignment'
        - type: object
          properties:
            attendanceRecord: { anyOf: [{ $ref: '#/components/schemas/AttendanceRecord' }, { type: 'null' }] }
            shift: { $ref: '#/components/schemas/Shift' }
            project: { $ref: '#/components/schemas/Project' }

    NoAssignmentToday:
      type: object
      required: [message]
      properties:
        message: { type: string, enum: ['No assignment today'] }

    # ===== Attendance =====
    AttendanceRecord:
      type: object
      required: [id, shiftAssignmentId, status]
      properties:
        id: { type: string, format: uuid }
        shiftAssignmentId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        checkInAt: { type: [string, 'null'], format: date-time }
        checkOutAt: { type: [string, 'null'], format: date-time }
        checkInGps: { anyOf: [{ $ref: '#/components/schemas/GPSCoordinate' }, { type: 'null' }] }
        checkOutGps: { anyOf: [{ $ref: '#/components/schemas/GPSCoordinate' }, { type: 'null' }] }
        checkInPhotoUrl: { type: [string, 'null'] }
        checkOutPhotoUrl: { type: [string, 'null'] }
        status: { type: string, enum: [present, late, early_leave, half_day, absent, on_leave, holiday] }
        totalMinutesWorked: { type: [integer, 'null'] }
        overtimeMinutes: { type: [integer, 'null'] }
        lateMinutes: { type: [integer, 'null'] }
        overrideReason: { type: [string, 'null'] }
        overrideById: { type: [string, 'null'], format: uuid }
        overrideAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AttendanceRecordWithAssignment:
      allOf:
        - $ref: '#/components/schemas/AttendanceRecord'
        - type: object
          required: [shiftAssignment]
          properties:
            shiftAssignment:
              allOf:
                - $ref: '#/components/schemas/ShiftAssignment'
                - type: object
                  required: [employee, project, shift]
                  properties:
                    employee: { $ref: '#/components/schemas/AttendanceEmployeeView' }
                    project: { $ref: '#/components/schemas/Project' }
                    shift: { $ref: '#/components/schemas/Shift' }

    InternalAttendanceRecord:
      type: object
      additionalProperties: false
      required: [id, shiftAssignmentId, employeeId, workDate, status]
      properties:
        id: { type: string, format: uuid }
        shiftAssignmentId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        workDate: { type: string, format: date, description: Shift-assignment business date used for payroll period and holiday/weekend classification. }
        checkInAt: { type: [string, 'null'], format: date-time }
        checkOutAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [present, late, early_leave, half_day, absent, on_leave, holiday] }
        totalMinutesWorked: { type: [integer, 'null'] }
        overtimeMinutes: { type: [integer, 'null'] }
        lateMinutes: { type: [integer, 'null'] }

    CheckInRequest:
      type: object
      required: [shiftAssignmentId, gps, photoBase64]
      properties:
        shiftAssignmentId: { type: string, format: uuid }
        gps: { $ref: '#/components/schemas/GPSCoordinate' }
        photoBase64:
          type: string
          description: Decodable JPEG base64, max 5 MB and 16 MP, minimum raster 320x240

    CheckOutRequest:
      type: object
      required: [shiftAssignmentId, gps, photoBase64]
      properties:
        shiftAssignmentId: { type: string, format: uuid }
        gps: { $ref: '#/components/schemas/GPSCoordinate' }
        photoBase64:
          type: string
          description: Decodable JPEG base64, max 5 MB and 16 MP, minimum raster 320x240

    AttendanceOverride:
      type: object
      required: [reason, newStatus]
      properties:
        reason: { type: string, minLength: 10 }
        newStatus: { type: string, enum: [present, late, early_leave, half_day, absent, on_leave, holiday] }
        checkInAt: { type: [string, 'null'], format: date-time }
        checkOutAt: { type: [string, 'null'], format: date-time }

    ManualAttendanceEvent:
      type: object
      additionalProperties: false
      required: [event, occurredAt, reasonCode, reason]
      properties:
        event: { type: string, enum: [check_in, check_out] }
        occurredAt:
          type: string
          format: date-time
          description: Confirmed real event time; future values are rejected.
        reasonCode:
          type: string
          enum: [capture_unavailable, permission_blocked, device_failure]
        reason: { type: string, minLength: 10, maxLength: 500 }

    CustomerReportRequest:
      type: object
      required: [projectId, from, to, format]
      properties:
        projectId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        format: { type: string, enum: [pdf, csv] }

    CustomerReport:
      type: object
      required: [id, tenantId, projectId, periodFrom, periodTo, format, fileKey, generatedBy, generatedAt, project]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
        format: { type: string, enum: [pdf, csv] }
        fileKey: { type: string, description: Private MinIO object key; not a public URL. }
        generatedBy: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        project:
          type: object
          required: [code, name, clientName]
          properties:
            code: { type: string }
            name: { type: string }
            clientName: { type: string }

    # ===== Payroll =====
    PayrollPeriod:
      type: object
      required: [id, year, month, status]
      properties:
        id: { type: string, format: uuid }
        year: { type: integer }
        month: { type: integer, minimum: 1, maximum: 12 }
        status: { type: string, enum: [open, calculating, calculated, approved, paid, locked] }
        totalGross: { type: [string, 'null'] }
        totalNet: { type: [string, 'null'] }
        totalEmployees: { type: [integer, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        lockedAt: { type: [string, 'null'], format: date-time }

    PayrollLine:
      type: object
      required: [id, payrollPeriodId, employeeId, gross, net]
      properties:
        id: { type: string, format: uuid }
        payrollPeriodId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        daysWorked: { type: integer }
        workdayUnits: { type: string, description: Decimal paid-day units; half-day is 0.50. }
        daysOnLeave: { type: integer }
        absentDays: { type: integer }
        totalWorkMinutes: { type: integer }
        overtimeWeekdayMinutes: { type: integer }
        overtimeWeekendMinutes: { type: integer }
        overtimeHolidayMinutes: { type: integer }
        lateMinutes: { type: integer }
        baseSalary: { type: string }
        proratedBase: { type: string }
        overtimeWeekdayAmount: { type: string }
        overtimeWeekendAmount: { type: string }
        overtimeHolidayAmount: { type: string }
        latePenalty: { type: string }
        allowances: { type: string }
        allowancesOverridden: { type: boolean }
        gross: { type: string }
        bhxhNhanVien: { type: string, description: Always zero in ADR-003 MVP. }
        bhxhDoanhNghiep: { type: string, description: Always zero in ADR-003 MVP. }
        bhytNhanVien: { type: string, description: Always zero in ADR-003 MVP. }
        bhytDoanhNghiep: { type: string, description: Always zero in ADR-003 MVP. }
        bhtnNhanVien: { type: string, description: Always zero in ADR-003 MVP. }
        bhtnDoanhNghiep: { type: string, description: Always zero in ADR-003 MVP. }
        thueTNCN: { type: string, description: Always zero in ADR-003 MVP. }
        tongKhauTru: { type: string, description: Always zero in ADR-003 MVP. }
        advance: { type: string }
        otherDeductions: { type: string }
        net: { type: string }
        overrideReason: { type: [string, 'null'] }
        overrideById: { type: [string, 'null'], format: uuid }
        overrideAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        employee:
          type: object
          required: [id, employeeCode, fullName]
          properties:
            id: { type: string, format: uuid }
            employeeCode: { type: string }
            fullName: { type: string }

    PayrollLineOverride:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10 }
        advance: { type: string }
        otherDeductions: { type: string }
        allowances: { type: string }
        clearAllowancesOverride:
          type: boolean
          description: Clear a prior manual allowance override and recompute it from the active rule; mutually exclusive with allowances.

    PayrollRule:
      type: object
      required: [id, effectiveFrom, otWeekdayMultiplier, otWeekendMultiplier, otHolidayMultiplier, roundingMinutes, workingHoursPerDay, standardWorkingDaysPerMonth, taxMode]
      properties:
        id: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        otWeekdayMultiplier: { type: string, example: '1.50' }
        otWeekendMultiplier: { type: string, example: '2.00' }
        otHolidayMultiplier: { type: string, example: '3.00' }
        latePenaltyPerMinute: { type: [string, 'null'] }
        maxLatePenaltyPerDay: { type: [string, 'null'] }
        mealAllowancePerDay: { type: [string, 'null'] }
        phoneAllowance: { type: [string, 'null'] }
        roundingMinutes: { type: integer, default: 15 }
        workingHoursPerDay: { type: integer, default: 8 }
        standardWorkingDaysPerMonth: { type: integer, default: 26 }
        taxMode: { type: string, enum: [none] }

    PayrollRuleCreate:
      type: object
      additionalProperties: false
      required: [effectiveFrom, otWeekdayMultiplier, otWeekendMultiplier, otHolidayMultiplier]
      properties:
        effectiveFrom: { type: string, format: date }
        otWeekdayMultiplier: { type: number, minimum: 1, maximum: 5 }
        otWeekendMultiplier: { type: number, minimum: 1, maximum: 5 }
        otHolidayMultiplier: { type: number, minimum: 1, maximum: 5 }
        latePenaltyPerMinute: { type: string, pattern: '^\d{1,13}(?:\.\d{1,2})?$' }
        maxLatePenaltyPerDay: { type: string, pattern: '^\d{1,13}(?:\.\d{1,2})?$' }
        mealAllowancePerDay: { type: string, pattern: '^\d{1,13}(?:\.\d{1,2})?$' }
        phoneAllowance: { type: string, pattern: '^\d{1,13}(?:\.\d{1,2})?$' }
        roundingMinutes: { type: integer, minimum: 1, default: 15 }
        workingHoursPerDay: { type: integer, minimum: 1, maximum: 24, default: 8 }
        standardWorkingDaysPerMonth: { type: integer, minimum: 1, maximum: 31, default: 26 }
        taxMode: { type: string, enum: [none], default: none }

    Permission:
      type: object
      required: [id, code, module, action]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: attendance.override }
        module: { type: string, example: attendance }
        action: { type: string, example: update }
        description: { type: [string, 'null'] }

    RolePermissions:
      type: object
      required: [role, permissions]
      properties:
        role:
          type: string
          enum: [employee, supervisor, bo_admin, system_admin]
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }

    # ===== Audit =====
    AuditLog:
      type: object
      required: [id, actorId, action, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorRole: { type: string }
        action: { type: string, example: override_attendance }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        previousValue: { type: [object, 'null'] }
        newValue: { type: [object, 'null'] }
        ipAddress: { type: string }
        occurredAt: { type: string, format: date-time }
